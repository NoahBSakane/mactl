# agents.conf - everything that is specific to one AI coding agent, in one place.
#
# The scripts (hooks, probe, memory harvest, headless runner, takeover) contain no agent names:
# they read this file. To add or swap an agent, add a [section] here, a section in the registry
# (~/.knowledge/ai-agents.md) for the human-readable spec, and the manifest rows that wire its
# config files. Nothing else needs to change.
#
# Format: [section] then `key = value` lines. Lists are space separated. `#` starts a comment at
# the beginning of a line. Commands run with `sh -c`; $AGENT_PROMPT carries the prompt.
#
#   label           display name in the status line (default: the section name)
#   bin             the executable name (also what `command -v` looks for)
#   version         command printing the version (first line is used)
#   auth            command that exits 0 when the agent is logged in (empty = always)
#   models          command listing the models, run only when the agent is ready
#   shell_tools     hook tool names that run shell commands
#   edit_tools      hook tool names that edit files
#   subagent_tools  hook tool names that start subagents
#   readonly_subagents  subagent types that never need composition approval
#   exec_sub        words that mark an *executing* launch (e.g. `codex exec`)
#   exec_flag       flags that mark an executing launch (e.g. `agy -p`)
#   nonexec_sub     first words that are never an executing launch (models, login, ...)
#   memory          globs of the agent's own memory files (a word starting with ! excludes that
#                   file name); only files that exist are used
#   research        read-only web research, headless; the safest setup the agent offers
#   interactive     start the agent interactively on $AGENT_PROMPT (takeover)
#   ask             a plain question, no tools, nothing written (stdin-free; $AGENT_PROMPT): used to get a
#                   suggestion as text (public-check.py --suggest)
#   ping            the cheapest real call that proves the agent can answer; limit-check.sh uses it to
#                   notice that a usage limit has been lifted (resets can come early, e.g. a reset ticket)

[runtime]
# order in which headless jobs try agents; an agent that is missing, logged out or out of quota is
# skipped (and remembered as unavailable until its limit resets)
order = claude codex muse agy grok
# models whose use needs the user's say-so (cost); /ofuro allows them only when told to
costly_models = opus fable

[claude]
label = Claude Code
bin = claude
version = claude --version
auth =
models = echo "    alias: sonnet / opus / haiku / fable, or a full model id"
shell_tools = Bash
edit_tools = Write Edit MultiEdit NotebookEdit
subagent_tools = Agent Task Workflow
readonly_subagents = Explore Plan claude-code-guide statusline-setup
memory = ~/.claude/projects/*/memory/*.md !MEMORY.md
research = claude -p "$AGENT_PROMPT" --model sonnet --effort medium --permission-mode dontAsk --allowedTools WebSearch WebFetch --max-turns 40
interactive =
ping = claude -p "Reply with the single word OK." --model haiku --max-turns 1
ask = claude -p "$AGENT_PROMPT" --model sonnet --permission-mode dontAsk --max-turns 3

[codex]
label = Codex
bin = codex
version = codex --version
auth = codex login status
models = codex debug models | jq -r '.models[] | "    \(.slug)  — \(.description)"'
shell_tools = Bash
edit_tools = apply_patch
exec_sub = exec review
memory = ~/.codex/memories/memory_summary.md ~/.codex/memories/MEMORY.md
research = codex exec "$AGENT_PROMPT" --sandbox read-only --skip-git-repo-check
interactive = exec codex "$AGENT_PROMPT"
ping = codex exec "Reply with the single word OK." --sandbox read-only --skip-git-repo-check
ask = codex exec "$AGENT_PROMPT" --sandbox read-only --skip-git-repo-check

[agy]
label = agy
bin = agy
version = agy --version
auth = [ -n "$(agy models 2>/dev/null | grep -v '^Fetching' | head -1)" ]
models = agy models | grep -v '^Fetching' | awk -F'\t' '{printf "    %s\n", $1}'
shell_tools = run_command
edit_tools = write_to_file replace_file_content multi_replace_file_content
exec_flag = -p --print --prompt
nonexec_sub = models changelog update install mcp plugin plugins agent agents remote-control help
# no persistent memory: agy keeps session logs only (~/.gemini/antigravity-cli/brain, conversations)
memory =
# headless agy (-p) cannot ask for permission, and a read_url allow-rule is per domain (no wildcard;
# a hook cannot add one in time either - all verified). So the research job runs with
# --dangerously-skip-permissions and agy-job-guard.sh (a PreToolUse hook on every tool, active only when
# AGENT_JOB is set, fail-closed) leaves nothing but web search and page fetch. The preflight refuses to
# start when the guard is not installed.
research = command -v jq >/dev/null && grep -q agy-job-guard "$HOME/.gemini/config/hooks.json" && agy -p "$AGENT_PROMPT" --dangerously-skip-permissions
interactive = exec agy --prompt-interactive "$AGENT_PROMPT"
ping = agy -p "Reply with the single word OK."
ask = agy -p "$AGENT_PROMPT"

[muse]
label = Muse
bin = muse
version = muse --version
auth = [ -s "$HOME/.config/muse/auth.json" ] || [ -n "${META_API_KEY:-}" ]
models = echo "    (muse model-profile show <model> --effort <tier>)"
shell_tools = shell exec_command local_shell Shell
edit_tools = edit_file write_file create_file str_replace_based_edit_tool
exec_sub = exec
# built-in memory (scopes personal / personal_project under XDG dirs, project: <repo>/.agents/memory);
# the personal paths are not documented and none exist yet - candidates are listed so they are
# picked up as soon as Muse creates them
memory = ~/.config/muse/memory/*.md ~/.local/share/muse/memory/*.md !MEMORY.md
research = muse exec "$AGENT_PROMPT" --disable-approval --disable-write --disable-shell --no-foreign-personal-context
interactive = exec muse "$AGENT_PROMPT"
ping = muse exec "Reply with the single word OK." --disable-approval --disable-write --disable-shell --no-foreign-personal-context
ask = muse exec "$AGENT_PROMPT" --disable-approval --disable-write --disable-shell --no-foreign-personal-context

[grok]
label = Grok
bin = grok
version = grok version
auth =
models = grok models | head -20 | sed 's/^/    /'
exec_flag = -p --single --prompt
nonexec_sub = models inspect version
# memory exists (`grok memory`, /memory) but the paths are not documented; candidate
memory = ~/.grok/memory/*.md ~/.grok/memory/**/*.md !MEMORY.md
research =
interactive = exec grok "$AGENT_PROMPT"
